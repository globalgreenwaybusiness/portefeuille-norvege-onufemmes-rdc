name: Publier le portefeuille sur GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Vérifier les données et les ressources
        run: python3 scripts/validate.py
      - name: Vérifier JavaScript
        run: node --check app.js
      - name: Configurer Pages
        uses: actions/configure-pages@v5
      - name: Préparer les fichiers publics
        run: |
          mkdir -p _site
          cp index.html styles.css app.js .nojekyll _site/
          cp -r assets data _site/
      - name: Préparer l’artefact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer
        id: deployment
        uses: actions/deploy-pages@v4
